<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="9x9 보드에서 지뢰 10개를 피해 모든 안전한 칸을 열어보세요."
    />
    <title>지뢰찾기</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="game">
      <header class="game-header">
        <div>
          <p class="eyebrow">MINESWEEPER</p>
          <h1>지뢰찾기</h1>
          <p class="subtitle">조심스럽게 칸을 열어 모든 지뢰를 찾아보세요.</p>
        </div>
        <button class="restart-button" id="restart" type="button" aria-label="새 게임">
          <span aria-hidden="true">🙂</span>
          <span>새 게임</span>
        </button>
      </header>

      <section class="game-panel" aria-label="지뢰찾기 게임">
        <div class="status-bar">
          <div class="counter" aria-label="남은 지뢰 수">
            <span class="counter-icon" aria-hidden="true">🚩</span>
            <span id="mine-count">010</span>
            <span class="counter-label">남은 지뢰</span>
          </div>
          <p class="game-message" id="message" role="status" aria-live="polite">
            지뢰를 조심하세요!
          </p>
          <div class="counter timer" aria-label="경과 시간">
            <span class="counter-icon" aria-hidden="true">⏱️</span>
            <span id="timer">000</span>
            <span class="counter-label">초</span>
          </div>
        </div>

        <div
          class="board"
          id="board"
          role="grid"
          aria-label="9행 9열 지뢰찾기 보드"
        ></div>

        <p class="instructions">
          <span>🖱️ 좌클릭</span> 칸 열기
          <span class="instruction-divider">·</span>
          <span>🚩 우클릭</span> 깃발 표시
        </p>
      </section>
      <footer>첫 번째 칸에는 지뢰가 없습니다.</footer>
    </main>
  </body>
</html>
