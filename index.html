<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="10x10 보드에서 지뢰 10개를 피해 안전한 칸을 모두 열어보세요."
    />
    <title>지뢰찾기</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="game">
      <header class="game-header">
        <p class="eyebrow">MINESWEEPER</p>
        <h1>지뢰찾기</h1>
        <p class="subtitle">숫자를 단서 삼아 지뢰를 피해 모든 안전한 칸을 열어보세요.</p>
      </header>

      <section class="game-panel" aria-label="지뢰찾기 게임">
        <div class="settings">
          <label for="difficulty">난이도</label>
          <select id="difficulty">
            <option value="basic">기본 · 10×10, 지뢰 10개</option>
            <option value="beginner">초급 · 9×9, 지뢰 10개</option>
            <option value="intermediate">중급 · 16×16, 지뢰 40개</option>
            <option value="advanced">상급 · 16×30, 지뢰 99개</option>
            <option value="custom">사용자 지정</option>
          </select>
          <form class="custom-settings" id="custom-settings" hidden novalidate>
            <label>
              행
              <input
                id="custom-rows"
                type="number"
                min="5"
                max="30"
                step="1"
                value="10"
                required
              />
            </label>
            <label>
              열
              <input
                id="custom-cols"
                type="number"
                min="5"
                max="30"
                step="1"
                value="10"
                required
              />
            </label>
            <label>
              지뢰
              <input
                id="custom-mines"
                type="number"
                min="1"
                max="899"
                step="1"
                value="10"
                required
              />
            </label>
            <button class="apply-settings" type="submit">적용</button>
          </form>
        </div>

        <div class="status-bar">
          <div class="counter" aria-label="남은 지뢰 수">
            <span class="counter-icon" aria-hidden="true">🚩</span>
            <span id="mine-count">010</span>
            <span class="counter-label">남은 지뢰</span>
          </div>
          <button
            class="restart-button"
            id="restart"
            type="button"
            aria-label="새 게임"
            title="새 게임"
          >
            😀
          </button>
          <div class="counter timer" aria-label="경과 시간">
            <span class="counter-icon" aria-hidden="true">⏱️</span>
            <span id="timer">000</span>
            <span class="counter-label">초</span>
          </div>
        </div>

        <div class="board-viewport">
          <div
            class="board"
            id="board"
            role="grid"
            aria-label="10행 10열 지뢰찾기 보드"
          ></div>
        </div>

        <p class="game-message" id="message" role="status" aria-live="polite">
          지뢰를 조심하세요!
        </p>
        <p class="instructions">
          <span>좌클릭</span> 칸 열기
          <span class="instruction-divider">·</span>
          <span>우클릭</span> 깃발 표시
        </p>
      </section>
      <footer>첫 번째로 여는 칸에는 지뢰가 없습니다.</footer>
    </main>
  </body>
</html>
